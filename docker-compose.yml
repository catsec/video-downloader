# video-downloader — app only. cloudflared and (optional) Authentik run as their own
# stacks on the shared external `edge` network; this app just joins it, and the
# tunnel/auth layer reaches it as  http://video-downloader:8000 .
#
#   docker network create edge        # once, shared by cloudflared/auth/apps
#   docker compose up -d
services:
  video-downloader:
    build: .
    container_name: video-downloader
    # Optional direct host access. When fronted by cloudflared/Authentik on `edge`
    # this isn't needed — and note the direct port BYPASSES Authentik (no auth).
    # Remove this block to be reachable only via the tunnel/proxy.
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      # Optional: mount a Netscape-format cookies file for age-restricted / authenticated videos.
      # Export from your browser with the "Get cookies.txt LOCALLY" extension, then:
      #   - ./cookies.txt:/app/cookies.txt:ro
    environment:
      - MAX_FILE_AGE_SECONDS=3600
      - MAX_FILE_SIZE_MB=500
      - YTDLP_UPDATE_CHECK_INTERVAL=600
      - POST_SERVE_DELETE_DELAY=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - edge

networks:
  edge:
    external: true        # created once: docker network create edge
